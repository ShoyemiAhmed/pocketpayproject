<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | PocketPay</title>

    <link rel="stylesheet"
          href="css/profile.css">

    <link rel="stylesheet" href="css/toast.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <!-- Header -->

        <div class="header">

            <a href="dashboard.html"
               class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <h2>My Profile</h2>

        </div>

        <!-- Profile Image -->

           <div class="profile-image">

                <img
             src="images/IMG_1871.PNG"
             id="profileImage"
             alt="Profile">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden>

         <button
             type="button"
            id="changePhotoBtn">

         <i class="fa-solid fa-camera"></i>

              Change Photo

    </button>

</div>

        <!-- Editable Form -->

        <form id="profileForm">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName">

                <small
                    class="error"
                    id="nameError"></small>

            </div>

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email">

                <small
                    class="error"
                    id="emailError"></small>

            </div>

            <div class="input-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone">

                <small
                    class="error"
                    id="phoneError"></small>

            </div>

            <div class="input-group">

                <label>Wallet ID</label>

                <input
                    type="text"
                    id="walletID"
                    value="PP20260001"
                    readonly>

            </div>

            <button
                type="submit"
                id="saveBtn">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Changes

            </button>

        </form>

        <p id="successMessage"
           class="success-message">

            Profile Updated Successfully!

        </p>

        <!-- Quick Actions -->

        <div class="actions">

            <button
                id="passwordBtn">

                <i class="fa-solid fa-lock"></i>

                Change Password

            </button>

            <button
                id="settingsBtn">

                <i class="fa-solid fa-gear"></i>

                Settings

            </button>

            <button
                id="logoutBtn"
                class="logout">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </div>

</div>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/toast.js"></script>
<script src="js/profile.js"></script>

<script>
    requireLogin();
</script>

</body>

</html>
