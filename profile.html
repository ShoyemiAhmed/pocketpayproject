<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | PocketPay</title>

    <link rel="stylesheet"
          href="css/profile.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <!-- Header -->

        <div class="header">

            <a href="dashboard.html" class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <h2>My Profile</h2>

        </div>

        <!-- Profile Image -->

        <div class="profile-image">

            <img src="images/profile.png"
                 alt="Profile">

        </div>

        <!-- User Details -->

        <div class="info">

            <div class="info-row">

                <label>Full Name</label>

                <p id="fullName">
                    Shoyemi Olanrewaju
                </p>

            </div>

            <div class="info-row">

                <label>Email</label>

                <p id="email">
                    ahmed@email.com
                </p>

            </div>

            <div class="info-row">

                <label>Phone</label>

                <p id="phone">
                    +2348165169640
                </p>

            </div>

            <div class="info-row">

                <label>Wallet ID</label>

                <p id="walletID">
                    PP20260001
                </p>

            </div>

        </div>

        <!-- Buttons -->

        <div class="actions">

            <button id="editBtn">

                <i class="fa-solid fa-user-pen"></i>

                Edit Profile

            </button>

            <button id="passwordBtn">

                <i class="fa-solid fa-lock"></i>

                Change Password

            </button>

            <button id="settingsBtn">

                <i class="fa-solid fa-gear"></i>

                Settings

            </button>

            <button id="logoutBtn" class="logout">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </div>

</div>

<script src="js/profile.js"></script>

</body>

</html>
