<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPay Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/notifications.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <!-- Header -->

    <header>

        <div class="logo">

            <img src="images/pocketpaynew.png" alt="PocketPay">

        </div>

        <div class="icons">

    <div class="notification-wrapper">

    <i
        id="notificationBell"
        class="fa-regular fa-bell"
        title="Notifications"
    ></i>

    <span
        id="notificationBadge"
        class="notification-badge"
    >
        0
    </span>

</div>

    <a href="profile.html">

        <img
            id="dashboardProfileImage"
            src="images/profile.png"
            alt="Profile">

    </a>

</div>

    </header>

    <!-- Greeting -->

    <section class="greeting">

        <h2 id="greeting" ></h2>

        <p>Welcome back to PocketPay</p>

    </section>

    <!-- Wallet Card -->

    <section class="wallet-card">

        <p>Available Balance</p>

        <h1 id="balance">₦1,200,000.00</h1>

        <button id="toggleBalance">

            <i class="fa-regular fa-eye"></i>

             Hide Balance
        </button>

        <small>Wallet ID: PP20260001</small>

    </section>
         <section class="quick-actions">

    <h3>Quick Actions</h3>

    <div class="actions-grid">

        <div class="action-card" 
             id="sendMoney">
            <i class="fa-solid fa-paper-plane"></i>
            <p>Send Money</p>
        </div>

        <div class="action-card"
            id="receiveMoney">
            <i class="fa-solid fa-download"></i>
            <p>Receive Money</p>
        </div>

        <div class="action-card"
            id="addMoney">
            <i class="fa-solid fa-wallet"></i>
            <p>Add Money</p>
        </div>

        <div class="action-card"
            id="airtime">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <p> Airtime Top up </p>
        </div>
    </div>
         </section>
            
           <section class="transactions">

    <div class="section-header">
        <h3>Recent Transactions</h3>
        <a href="transaction-history.html">

            See All

        </a>
    </div>

    <div id="recentTransactions">

    </div>

           </section>

          <!-- Bottom Navigation -->

<nav class="bottom-nav">

    <a href="dashboard.html" class="active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="transaction-history.html">

        <i class="fa-solid fa-receipt"></i>
        <span>Transactions</span>
    </a>

    <a href="#">
        <i class="fa-regular fa-credit-card"></i>
        <span>Cards</span>
    </a>

    <a href="profile.html">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
    </a>

</nav>
    </div>

</section>


</div>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/notifications.js"></script>

<script>
    requireLogin();
</script>


<!-- =================================
     NOTIFICATION PANEL
================================= -->

<div
    id="notificationBackdrop"
    class="notification-backdrop"
></div>

<div
    id="notificationPanel"
    class="notification-panel"
    
>

    <div class="notification-header">

        <h2>Notifications</h2>

        <div class="notification-header-actions">

            <button
                id="markAllNotifications"
                title="Mark all as read"
            >
                <i class="fa-solid fa-check-double"></i>
            </button>

            <button
                id="closeNotifications"
                title="Close"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

    </div>

    <div
        id="notificationList"
        class="notification-list"
    ></div>

</div>

</body>
</html>
