<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Airtime & Data | PocketPay</title>

    <link rel="stylesheet" href="css/airtime.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="airtime-card">

        <!-- Header -->

        <div class="header">

            <a href="dashboard.html" class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <h2>Airtime & Data</h2>

        </div>

        <p class="subtitle">

            Buy Airtime or Data instantly.

        </p>

        <!-- Form -->

        <form id="airtimeForm">

            <div class="input-group">

                <label>Service</label>

                <select id="service">

                    <option value="">Select Service</option>

                    <option value="Airtime">Airtime</option>

                    <option value="Data">Data Bundle</option>

                </select>

                <small class="error" id="serviceError"></small>

            </div>

            <div class="input-group">

                <label>Network</label>

                <select id="network">

                    <option value="">Select Network</option>

                    <option value="MTN">MTN</option>

                    <option value="Airtel">Airtel</option>

                    <option value="Glo">Glo</option>

                    <option value="9mobile">9mobile</option>

                </select>

                <small class="error" id="networkError"></small>

            </div>

            <div class="input-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="08012345678">

                <small class="error" id="phoneError"></small>

            </div>

            <div class="input-group">

                <label>Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter Amount">

                <small class="error" id="amountError"></small>

            </div>

            <button type="submit">

                Continue

            </button>

        </form>

        <!-- Purchase Summary -->

        <div class="summary-card">

            <h3>Purchase Summary</h3>

            <div class="summary-row">

                <span>Service</span>

                <strong id="summaryService">-</strong>

            </div>

            <div class="summary-row">

                <span>Network</span>

                <strong id="summaryNetwork">-</strong>

            </div>

            <div class="summary-row">

                <span>Phone</span>

                <strong id="summaryPhone">-</strong>

            </div>

            <div class="summary-row">

                <span>Amount</span>

                <strong id="summaryAmount">₦0.00</strong>

            </div>

        </div>

    </div>

</div>

<!-- ===========================
     Confirmation Modal
=========================== -->

<div class="modal" id="confirmModal">

    <div class="modal-content">

        <h2>Confirm Purchase</h2>

        <p>

            <strong>Service:</strong>

            <span id="modalService"></span>

        </p>

        <p>

            <strong>Network:</strong>

            <span id="modalNetwork"></span>

        </p>

        <p>

            <strong>Phone:</strong>

            <span id="modalPhone"></span>

        </p>

        <p>

            <strong>Amount:</strong>

            <span id="modalAmount"></span>

        </p>

        <div class="buttons">

            <button id="cancelBtn">

                Cancel

            </button>

            <button id="confirmBtn">

                Confirm

            </button>

        </div>

    </div>

</div>

<!-- ===========================
     Loading Modal
=========================== -->

<div class="modal" id="loadingModal">

    <div class="loading-content">

        <div class="spinner"></div>

        <h2>Processing Purchase...</h2>

        <p>Please wait...</p>

    </div>

</div>

<!-- ===========================
     Success Modal
=========================== -->

<div class="modal" id="successModal">

    <div class="modal-content success">

        <i class="fa-solid fa-circle-check success-icon"></i>

        <h2>Purchase Successful</h2>

        <p>

            <strong>Reference:</strong>

            <span id="reference"></span>

        </p>

        <p>

            <strong>Amount:</strong>

            <span id="receiptAmount"></span>

        </p>

        <button id="backDashboardBtn">

            Back to Dashboard

        </button>

    </div>

</div>

<script src="js/storage.js"></script>
<script src="js/airtime.js"></script>

</body>

</html>
